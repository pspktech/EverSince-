name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, for example 1.1.0"
        required: true
        default: "1.1.0"
      version_code:
        description: "Integer version code"
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write release version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, re
          p = "app/build.gradle.kts"
          s = open(p).read()
          s = re.sub(r'versionCode = \d+', f'versionCode = {os.environ["VERSION_CODE"]}', s)
          s = re.sub(r'versionName = "[^"]+"', f'versionName = "{os.environ["VERSION_NAME"]}"', s)
          open(p, "w").write(s)
          PY

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          cat > keystore.properties <<PROPERTIES
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Prepare OTA APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: cp app/build/outputs/apk/release/app-release.apk "EverSince-v${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: EverSince ${{ inputs.version_name }}
          generate_release_notes: true
          files: EverSince-v${{ inputs.version_name }}.apk
